<div class="auth-shell">
  <div class="auth-panel">
    <div class="auth-panel-body">

      <!-- Brand -->
      <div class="auth-brand">
        <div class="brand-mark-sm">F</div>
        <div>
          <div class="brand-name">{{'FINANCE_DASHBOARD'|translate}}</div>
          <div class="brand-tagline">{{'PREMIUM_EXPENSE_TRACKING'|translate}}</div>
        </div>
      </div>

      <!-- Header -->
      <div class="auth-header">
        <div class="eyebrow">✦ {{'WELCOME_BACK'|translate}}</div>
        <h1 class="auth-title">{{'SIGN_IN_TO_WORKSPACE'|translate}}</h1>
        <p class="auth-subtitle">{{'SECURELY_ACCESS'|translate}}</p>
      </div>

      <!-- Form -->
      <form class="auth-form" (ngSubmit)="login()">

        <div class="field-group">
          <label for="email-input" class="form-label">{{'EMAIL_ADDRESS'}}</label>
          <div class="input-wrap">
            <span class="input-icon-el">✉</span>
            <input
              id="email-input"
              class="field-input"
              name="email"
              type="email"
              autocomplete="email"
              [placeholder]="'EMAIL_PLACEHOLDER'|translate"
              [(ngModel)]="email">
          </div>
        </div>

        <div class="field-group">
          <label for="password-input" class="form-label">{{'PASSWORD'}}</label>
          <div class="input-wrap">
            <span class="input-icon-el">🔒</span>
            <input
              id="password-input"
              class="field-input"
              name="password"
              type="password"
              autocomplete="current-password"
              [placeholder]="'PASSWORD_PLACEHOLDER'|translate"
              [(ngModel)]="password">
          </div>
        </div>

        <button class="btn-submit" type="submit">{{'CONTINUE'|translate}} →</button>
      </form>

      <p class="auth-footer-link">{{'NO_ACCOUNT'|translate}} <a routerLink="/register">{{'CREATE_ONE_FREE'|translate}}</a></p>
    </div>
  </div>
</div>
