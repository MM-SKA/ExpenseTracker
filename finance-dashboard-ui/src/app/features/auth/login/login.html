<div class="auth-shell container-fluid py-5">
  <div class="auth-panel mx-auto">
    <div class="auth-panel-body p-5">
      <div class="auth-brand d-flex align-items-center gap-3 mb-4">
        <div class="brand-mark-sm">F</div>
        <div>
          <span class="h4 fw-semibold mb-0 d-block">Finance Dashboard</span>
          <small class="text-muted">Premium expense tracking</small>
        </div>
      </div>

      <div class="auth-header mb-4">
        <p class="eyebrow">Welcome back</p>
        <h1 class="auth-title mb-2">Sign in to your workspace</h1>
        <p class="auth-subtitle mb-0">Securely access your expenses, categories, and analytics in one place.</p>
      </div>

      <form class="auth-form" (ngSubmit)="login()">
        <div class="mb-4">
          <label for="email-input" class="form-label">Email</label>
          <div class="input-group input-group-lg rounded-4 overflow-hidden bg-dark border border-secondary">
            <span class="input-group-text input-icon">✉️</span>
            <input
              id="email-input"
              class="form-control input-dark border-0"
              name="email"
              type="email"
              placeholder="you@example.com"
              [(ngModel)]="email">
          </div>
        </div>

        <div class="mb-4">
          <label for="password-input" class="form-label">Password</label>
          <div class="input-group input-group-lg rounded-4 overflow-hidden bg-dark border border-secondary">
            <span class="input-group-text input-icon">🔒</span>
            <input
              id="password-input"
              class="form-control input-dark border-0"
              name="password"
              type="password"
              placeholder="Enter your password"
              [(ngModel)]="password">
          </div>
        </div>

        <div class="d-grid mb-3">
          <button class="btn btn-primary btn-lg" type="submit">Continue</button>
        </div>
      </form>

      <p class="auth-footer text-center text-muted mb-0">Don’t have an account? <a routerLink="/register">Register now</a></p>
    </div>
  </div>
</div>
