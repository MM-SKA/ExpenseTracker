<div class="auth-shell">
  <div class="auth-panel">
    <div class="auth-panel-body">

      <!-- Brand -->
      <div class="auth-brand">
        <div class="brand-mark-sm">F</div>
        <div>
          <div class="brand-name">Finance Dashboard</div>
          <div class="brand-tagline">Premium expense tracking</div>
        </div>
      </div>

      <!-- Header -->
      <div class="auth-header">
        <div class="eyebrow">✦ Welcome back</div>
        <h1 class="auth-title">Sign in to your <span>workspace</span></h1>
        <p class="auth-subtitle">Securely access your expenses, categories, and analytics in one place.</p>
      </div>

      <!-- Form -->
      <form class="auth-form" (ngSubmit)="login()">

        <div class="field-group">
          <label for="email-input" class="form-label">Email address</label>
          <div class="input-wrap">
            <span class="input-icon-el">✉</span>
            <input
              id="email-input"
              class="field-input"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              [(ngModel)]="email">
          </div>
        </div>

        <div class="field-group">
          <label for="password-input" class="form-label">Password</label>
          <div class="input-wrap">
            <span class="input-icon-el">🔒</span>
            <input
              id="password-input"
              class="field-input"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              [(ngModel)]="password">
          </div>
        </div>

        <button class="btn-submit" type="submit">Continue →</button>
      </form>

      <p class="auth-footer-link">Don't have an account? <a routerLink="/register">Create one free</a></p>
    </div>
  </div>
</div>
