<div class="login-shell">
  <div class="login-panel">
    <div class="login-brand">
      <span>Finance</span>
      <small>Dashboard</small>
    </div>

    <h2>Welcome back</h2>
    <p class="login-subtitle">Sign in to manage your expenses with a sleek, premium view.</p>

    <div class="field">
      <label for="email-input">Email</label>
      <input
        id="email-input"
        class="field-input"
        name="email"
        type="email"
        placeholder="you@example.com"
        [(ngModel)]="email">
    </div>

    <div class="field">
      <label for="password-input">Password</label>
      <input
        id="password-input"
        class="field-input"
        name="password"
        type="password"
        placeholder="Enter your password"
        [(ngModel)]="password" id="password">
    </div>

    <button
      class="primary-button"
      (click)="login()">
      Continue
    </button>
  </div>
</div>
