<div class="auth-shell">
  <div class="auth-panel">
    <div class="auth-panel-body">

      <!-- Brand -->
      <div class="auth-brand">
        <div class="brand-mark-sm">F</div>
        <div>
          <div class="brand-name">Finance Dashboard</div>
          <div class="brand-tagline">Create your free account</div>
        </div>
      </div>

      <!-- Header -->
      <div class="auth-header">
        <div class="eyebrow">✦ New account</div>
        <h1 class="auth-title">Get started <span>for free</span></h1>
        <p class="auth-subtitle">Track expenses, set budgets, and unlock smart analytics — all in one place.</p>
      </div>

      <!-- Form -->
      <form class="auth-form-grid" (ngSubmit)="register()">

        <div class="field-group">
          <label for="fullName-input" class="form-label">Full name</label>
          <div class="input-wrap">
            <span class="input-icon-el">👤</span>
            <input id="fullName-input" class="field-input" type="text" name="fullName" [(ngModel)]="fullName" placeholder="Jane Doe" autocomplete="name" />
          </div>
        </div>

        <div class="field-group">
          <label for="email-input" class="form-label">Email address</label>
          <div class="input-wrap">
            <span class="input-icon-el">✉</span>
            <input id="email-input" class="field-input" type="email" name="email" [(ngModel)]="email" placeholder="you@example.com" autocomplete="email" />
          </div>
        </div>

        <div class="field-group">
          <label for="password-input" class="form-label">Password</label>
          <div class="input-wrap">
            <span class="input-icon-el">🔒</span>
            <input id="password-input" class="field-input" type="password" name="password" [(ngModel)]="password" placeholder="Create a secure password" autocomplete="new-password" />
          </div>
        </div>

        <div class="field-group">
          <label for="phoneNumber-input" class="form-label">Phone number</label>
          <div class="input-wrap">
            <span class="input-icon-el">📱</span>
            <input id="phoneNumber-input" class="field-input" type="tel" name="phoneNumber" [(ngModel)]="phoneNumber" placeholder="+1 234 567 8900" autocomplete="tel" />
          </div>
        </div>

        <div class="col-span-2">
          <button class="btn-submit" type="submit">Create account →</button>
        </div>
      </form>

      <p class="auth-footer-link">Already have an account? <a routerLink="/">Sign in</a></p>
    </div>
  </div>
</div>
