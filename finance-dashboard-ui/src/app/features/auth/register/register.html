<div class="auth-shell">
  <div class="auth-panel">
    <div class="auth-panel-body">

      <!-- Brand -->
      <div class="auth-brand">
        <div class="brand-mark-sm">F</div>
        <div>
          <div class="brand-name">{{'FINANCE_DASHBOARD'|translate}}</div>
          <div class="brand-tagline">{{'CREATE_FREE_ACCOUNT'|translate}}</div>
        </div>
      </div>

      <!-- Header -->
      <div class="auth-header">
        <div class="eyebrow">✦ {{'NEW_ACCOUNT'|translate}}</div>
        <h1 class="auth-title">{{'GET_STARTED_FREE'|translate}}</h1>
        <p class="auth-subtitle">{{'TRACK_EXPENSES_BUDGETS'|translate}}</p>
      </div>

      <!-- Form -->
      <form class="auth-form-grid" (ngSubmit)="register()">

        <div class="field-group">
          <label for="fullName-input" class="form-label">{{'FULL_NAME'}}</label>
          <div class="input-wrap">
            <span class="input-icon-el">👤</span>
            <input id="fullName-input" class="field-input" type="text" name="fullName" [(ngModel)]="fullName" [placeholder]="'FULL_NAME_PLACEHOLDER'|translate" autocomplete="name" />
          </div>
        </div>

        <div class="field-group">
          <label for="email-input" class="form-label">{{'EMAIL_ADDRESS'|translate}}</label>
          <div class="input-wrap">
            <span class="input-icon-el">✉</span>
            <input id="email-input" class="field-input" type="email" name="email" [(ngModel)]="email" placeholder="you@example.com" autocomplete="email" />
          </div>
        </div>

        <div class="field-group">
          <label for="password-input" class="form-label">{{'PASSWORD'|translate}}</label>
          <div class="input-wrap">
            <span class="input-icon-el">🔒</span>
            <input id="password-input" class="field-input" type="password" name="password" [(ngModel)]="password" [placeholder]="'CREATE_PASSWORD'|translate" autocomplete="new-password" />
          </div>
        </div>

        <div class="field-group">
          <label for="phoneNumber-input" class="form-label">{{'PHONE_NUMBER'|translate}}</label>
          <div class="input-wrap">
            <span class="input-icon-el">📱</span>
            <input id="phoneNumber-input" class="field-input" type="tel" name="phoneNumber" [(ngModel)]="phoneNumber" placeholder="+1 234 567 8900" autocomplete="tel" />
          </div>
        </div>

        <div class="col-span-2">
          <button class="btn-submit" type="submit">{{'CREATE_ACCOUNT'|translate}} →</button>
        </div>
      </form>

      <p class="auth-footer-link">{{'ALREADY_HAVE_ACCOUNT'|translate}} <a routerLink="/">{{'SIGN_IN'|translate}}</a></p>
    </div>
  </div>
</div>
