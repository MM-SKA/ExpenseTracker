<div class="ef-page">

  <p class="ef-eyebrow">{{'EDIT_EXPENSE_LABEL'|translate}}</p>
  <h1 class="ef-title">{{'UPDATE_YOUR_EXPENSE'|translate}}</h1>
  <p class="ef-subtitle">{{'UPDATE_EXPENSE_SUBTITLE'|translate}}</p>

  <div class="ef-card">
    <div class="ef-card-body">
      <form class="ef-grid" (ngSubmit)="updateExpense()">

        <!-- Category -->
        <div class="ef-field">
          <label class="ef-label" for="category-dropdown">{{'CATEGORY'|translate}}</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">🏷</span>
            <select id="category-dropdown" class="ef-select" name="category" [(ngModel)]="categoryId">
              @for (category of categories; track category.id) {
                <option [value]="category.id">{{ category.name }}</option>
              }
            </select>
          </div>
        </div>

        <!-- Date -->
        <div class="ef-field">
          <label class="ef-label" for="date-input">{{'DATE'|translate}}</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">📅</span>
            <input id="date-input" class="ef-input" type="date" name="date" [(ngModel)]="date" />
          </div>
        </div>

        <!-- Description -->
        <div class="ef-field ef-col-full">
          <label class="ef-label" for="notes-input">{{'DESCRIPTION'|translate}}</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">📝</span>
            <input id="notes-input" class="ef-input" [placeholder]="'DESCRIPTION' | translate"
              [value]="notes" (input)="notes = $any($event.target).value" />
          </div>
        </div>

        <!-- Amount -->
        <div class="ef-field">
          <label class="ef-label" for="amount-input">{{'AMOUNT'|translate}}</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">$</span>
            <input id="amount-input" class="ef-input" type="number" step="0.01"
              name="amount" [placeholder]="'AMOUNT_PLACEHOLDER'|translate" [(ngModel)]="amount" />
          </div>
        </div>

        <!-- Location -->
        <div class="ef-field">
          <label class="ef-label" for="location-input">{{'LOCATION'|translate}}</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">📍</span>
            <input id="location-input" class="ef-input" name="location"
              [placeholder]="'LOCATION_PLACEHOLDER'|translate" [(ngModel)]="location" />
          </div>
        </div>

        <!-- Submit -->
        <div class="ef-col-full">
          <button class="ef-submit" type="submit">{{'UPDATE_EXPENSE'|translate}} →</button>
        </div>

      </form>
    </div>
  </div>

</div>
