<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-xl-8">

      <div class="page-card card border-0 shadow-lg overflow-hidden">

        <div class="card-body p-5">

          <div class="page-header mb-4">
            <p class="eyebrow mb-2">Edit expense</p>
            <h1 class="section-title mb-2">Update your expense</h1>
            <p class="subtitle-text mb-0">
              Modify the details below and save your changes.
            </p>
          </div>

          <div class="panel-card p-4">

            <form class="row g-4" (ngSubmit)="updateExpense()">

              <!-- Category -->

              <div class="col-md-6">
                <label class="form-label" for="category-dropdown">
                  Category
                </label>

                <div
                  class="input-group input-group-lg rounded-4 overflow-hidden bg-dark border border-secondary">

                  <span class="input-group-text input-icon">
                    🏷️
                  </span>

                  <select
                    id="category-dropdown"
                    class="form-select input-dark border-0"
                    name="category"
                    [(ngModel)]="categoryId">

                    @for(category of categories; track category.id){
                      <option [value]="category.id">
                        {{ category.name }}
                      </option>
                    }

                  </select>

                </div>
              </div>

              <!-- Date -->

              <div class="col-md-6">

                <label class="form-label" for="date-input">
                  Date
                </label>

                <div
                  class="input-group input-group-lg rounded-4 overflow-hidden bg-dark border border-secondary">

                  <span class="input-group-text input-icon">
                    📅
                  </span>

                  <input
                    id="date-input"
                    class="form-control input-dark border-0"
                    type="date"
                    name="date"
                    [(ngModel)]="date">

                </div>

              </div>

              <!-- Description -->

              <div class="col-12">

                <label class="form-label" for="notes-input">
                  Description
                </label>

                <div
                  class="input-group input-group-lg rounded-4 overflow-hidden bg-dark border border-secondary">

                  <span class="input-group-text input-icon">
                    📝
                  </span>

                  <input
                    id="notes-input"
                    class="form-control input-dark border-0"
                    name="notes"
                    placeholder="Expense description"
                    [(ngModel)]="notes">

                </div>

              </div>

              <!-- Amount -->

              <div class="col-md-6">

                <label class="form-label" for="amount-input">
                  Amount
                </label>

                <div
                  class="input-group input-group-lg rounded-4 overflow-hidden bg-dark border border-secondary">

                  <span class="input-group-text input-icon">
                    💲
                  </span>

                  <input
                    id="amount-input"
                    class="form-control input-dark border-0"
                    type="number"
                    step="0.01"
                    name="amount"
                    placeholder="0.00"
                    [(ngModel)]="amount">

                </div>

              </div>

              <!-- Location -->

              <div class="col-md-6">

                <label class="form-label" for="location-input">
                  Location
                </label>

                <div
                  class="input-group input-group-lg rounded-4 overflow-hidden bg-dark border border-secondary">

                  <span class="input-group-text input-icon">
                    📍
                  </span>

                  <input
                    id="location-input"
                    class="form-control input-dark border-0"
                    name="location"
                    placeholder="Restaurant, Store..."
                    [(ngModel)]="location">

                </div>

              </div>

              <div class="col-12 d-grid mt-2">

                <button
                  class="btn btn-primary btn-lg"
                  type="submit">

                  💾 Update Expense

                </button>

              </div>

            </form>

          </div>

        </div>

      </div>

    </div>
  </div>
</div>
