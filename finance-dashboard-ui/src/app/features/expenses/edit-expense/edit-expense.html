<div class="ef-page">

  <p class="ef-eyebrow">Edit expense</p>
  <h1 class="ef-title">Update your expense</h1>
  <p class="ef-subtitle">Modify the details below and save your changes.</p>

  <div class="ef-card">
    <div class="ef-card-body">
      <form class="ef-grid" (ngSubmit)="updateExpense()">

        <!-- Category -->
        <div class="ef-field">
          <label class="ef-label" for="category-dropdown">Category</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">🏷</span>
            <select id="category-dropdown" class="ef-select" name="category" [(ngModel)]="categoryId">
              @for (category of categories; track category.id) {
                <option [value]="category.id">{{ category.name }}</option>
              }
            </select>
          </div>
        </div>

        <!-- Date -->
        <div class="ef-field">
          <label class="ef-label" for="date-input">Date</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">📅</span>
            <input id="date-input" class="ef-input" type="date" name="date" [(ngModel)]="date" />
          </div>
        </div>

        <!-- Description -->
        <div class="ef-field ef-col-full">
          <label class="ef-label" for="notes-input">Description</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">📝</span>
            <input id="notes-input" class="ef-input" placeholder="Description…"
              [value]="notes" (input)="notes = $any($event.target).value" />
          </div>
        </div>

        <!-- Amount -->
        <div class="ef-field">
          <label class="ef-label" for="amount-input">Amount</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">$</span>
            <input id="amount-input" class="ef-input" type="number" step="0.01"
              name="amount" placeholder="0.00" [(ngModel)]="amount" />
          </div>
        </div>

        <!-- Location -->
        <div class="ef-field">
          <label class="ef-label" for="location-input">Location</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">📍</span>
            <input id="location-input" class="ef-input" name="location"
              placeholder="Restaurant, Store…" [(ngModel)]="location" />
          </div>
        </div>

        <!-- Submit -->
        <div class="ef-col-full">
          <button class="ef-submit" type="submit">Update expense →</button>
        </div>

      </form>
    </div>
  </div>

</div>
