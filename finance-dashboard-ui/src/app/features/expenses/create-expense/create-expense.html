<div class="ef-page">

  <p class="ef-eyebrow">New expense</p>
  <h1 class="ef-title">Add a purchase</h1>
  <p class="ef-subtitle">Capture expenses with category, amount, and date for better reporting.</p>

  <div class="ef-card">
    <div class="ef-card-body">
      <form class="ef-grid" (ngSubmit)="save()">

        <!-- Category -->
        <div class="ef-field">
          <label for="category-list" class="ef-label">Category</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">🏷</span>
            <select id="category-list" class="ef-select" name="category"
              [(ngModel)]="categoryId"
              [disabled]="isLoadingCategories || categories.length === 0">
              @if (isLoadingCategories) {
                <option value="" disabled selected>Loading…</option>
              }
              @if (!isLoadingCategories && categories.length === 0) {
                <option value="" disabled>No categories</option>
              }
              @for (c of categories; track c.id) {
                <option [value]="c.id">{{ c.name }}</option>
              }
            </select>
          </div>
        </div>

        <!-- Date -->
        <div class="ef-field">
          <label for="date-input" class="ef-label">Date</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">📅</span>
            <input id="date-input" class="ef-input" name="date" type="date" [(ngModel)]="date" />
          </div>
        </div>

        <!-- Description -->
        <div class="ef-field ef-col-full">
          <label for="description-input" class="ef-label">Description</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">📝</span>
            <input id="description-input" class="ef-input" name="description"
              [(ngModel)]="description" placeholder="Coffee, groceries, subscription…" />
          </div>
        </div>

        <!-- Amount -->
        <div class="ef-field">
          <label for="amount-input" class="ef-label">Amount</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">$</span>
            <input id="amount-input" class="ef-input" name="amount"
              type="number" step="0.01" [(ngModel)]="amount" placeholder="0.00" />
          </div>
        </div>

        <!-- Location -->
        <div class="ef-field">
          <label for="location-input" class="ef-label">Location</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">📍</span>
            <input id="location-input" class="ef-input" name="location"
              [(ngModel)]="location" placeholder="Store, restaurant…" />
          </div>
        </div>

        <!-- Submit -->
        <div class="ef-col-full">
          <button class="ef-submit" type="submit">Save expense →</button>
        </div>

      </form>
    </div>
  </div>

</div>
