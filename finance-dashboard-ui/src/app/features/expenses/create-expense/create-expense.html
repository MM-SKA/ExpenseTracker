<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-xl-8">
      <div class="page-card card border-0 shadow-lg overflow-hidden">
        <div class="card-body p-5">
          <div class="page-header mb-4">
            <p class="eyebrow mb-2">New expense</p>
            <h1 class="section-title mb-2">Add a purchase</h1>
            <p class="subtitle-text mb-0">Capture expenses with category, amount, and date for better reporting.</p>
          </div>

          <div class="panel-card p-4 bg-dark rounded-4 border border-secondary">
            <form class="row g-4" (ngSubmit)="save()">
              <div class="col-md-6">
                <label for="category-list" class="form-label">Category</label>
                <div class="input-group input-group-lg rounded-4 overflow-hidden bg-dark border border-secondary">
                  <span class="input-group-text input-icon">🏷️</span>
                  <select id="category-list" class="form-select input-dark border-0" name="category" [(ngModel)]="categoryId" [disabled]="isLoadingCategories || categories.length === 0">
                    @if (isLoadingCategories) {
                    <option value="" disabled selected>Loading categories...</option>
                    }
                    @if (!isLoadingCategories && categories.length === 0) {
                    <option value="" disabled>No categories available</option>
                    }
                    @for (c of categories; track c.id) {
                    <option [value]="c.id">{{ c.name }}</option>
                    }
                  </select>
                </div>
              </div>

              <div class="col-md-6">
                <label for="date-input" class="form-label">Date</label>
                <div class="input-group input-group-lg rounded-4 overflow-hidden bg-dark border border-secondary">
                  <span class="input-group-text input-icon">📅</span>
                  <input id="date-input" class="form-control input-dark border-0" name="date" type="date" [(ngModel)]="date" />
                </div>
              </div>

              <div class="col-12">
                <label for="description-input" class="form-label">Description</label>
                <div class="input-group input-group-lg rounded-4 overflow-hidden bg-dark border border-secondary">
                  <span class="input-group-text input-icon">📝</span>
                  <input id="description-input" class="form-control input-dark border-0" name="description" [(ngModel)]="description" placeholder="Coffee, groceries, subscription" />
                </div>
              </div>

              <div class="col-md-6">
                <label for="amount-input" class="form-label">Amount</label>
                <div class="input-group input-group-lg rounded-4 overflow-hidden bg-dark border border-secondary">
                  <span class="input-group-text input-icon">💲</span>
                  <input id="amount-input" class="form-control input-dark border-0" name="amount" type="number" step="0.01" [(ngModel)]="amount" placeholder="0.00" />
                </div>
              </div>

              <div class="col-md-6">
                <label for="location-input" class="form-label">Location</label>
                <div class="input-group input-group-lg rounded-4 overflow-hidden bg-dark border border-secondary">
                  <span class="input-group-text input-icon">📍</span>
                  <input id="location-input" class="form-control input-dark border-0" name="location" [(ngModel)]="location" placeholder="Store, restaurant, etc." />
                </div>
              </div>

              <div class="col-12 d-grid">
                <button class="btn btn-primary btn-lg" type="submit">Save expense</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
