<div class="page">
	<h2>Add Expense</h2>

	<form (ngSubmit)="save()">
		<div>
			<label>Category</label>
			<select name="category" [(ngModel)]="categoryId">
				<option *ngFor="let c of categories" [value]="c.id">{{c.name}}</option>
			</select>
		</div>
		<div>
			<label>Description</label>
			<input name="description" [(ngModel)]="description" />
		</div>

		<div>
			<label>Amount</label>
			<input name="amount" type="number" step="0.01" [(ngModel)]="amount" />
		</div>

		<div>
			<label>Date</label>
			<input name="date" type="date" [(ngModel)]="date" />
		</div>

		<div style="margin-top:12px">
			<button type="submit">Save</button>
		</div>
	</form>

</div>
