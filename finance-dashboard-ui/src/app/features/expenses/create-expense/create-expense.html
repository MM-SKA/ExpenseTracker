<div class="ef-page">

  <p class="ef-eyebrow">{{'NEW_EXPENSE'|translate}}</p>
  <h1 class="ef-title">{{'ADD_PURCHASE'|translate}}</h1>
  <p class="ef-subtitle">{{'ADD_PURCHASE_SUBTITLE'|translate}}</p>

  <div class="ef-card">
    <div class="ef-card-body">
      <form class="ef-grid" (ngSubmit)="save()">

        <!-- Category -->
        <div class="ef-field">
          <label for="category-list" class="ef-label">{{'CATEGORY'|translate}}</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">🏷</span>
            <select id="category-list" class="ef-select" name="category"
              [(ngModel)]="categoryId"
              [disabled]="isLoadingCategories || categories.length === 0">
              @if (isLoadingCategories) {
                <option value="" disabled selected>{{'LOADING'|translate}}</option>
              }
              @if (!isLoadingCategories && categories.length === 0) {
                <option value="" disabled>{{'NO_CATEGORIES'|translate}}</option>
              }
              @for (c of categories; track c.id) {
                <option [value]="c.id">{{ c.name }}</option>
              }
            </select>
          </div>
        </div>

        <!-- Date -->
        <div class="ef-field">
          <label for="date-input" class="ef-label">{{'DATE'|translate}}</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">📅</span>
            <input id="date-input" class="ef-input" name="date" type="date" [(ngModel)]="date" />
          </div>
        </div>

        <!-- Description -->
        <div class="ef-field ef-col-full">
          <label for="description-input" class="ef-label">{{'DESCRIPTION'|translate}}</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">📝</span>
            <input id="description-input" class="ef-input" name="description"
              [(ngModel)]="description" [placeholder]="'Coffee, groceries, subscription…'" />
          </div>
        </div>

        <!-- Amount -->
        <div class="ef-field">
          <label for="amount-input" class="ef-label">{{'AMOUNT'|translate}}</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">₹</span>
            <input id="amount-input" class="ef-input" name="amount"
              type="number" step="0.01" [(ngModel)]="amount" placeholder="0.00" />
          </div>
        </div>

        <!-- Location -->
        <div class="ef-field">
          <label for="location-input" class="ef-label">{{'LOCATION'|translate}}</label>
          <div class="ef-input-wrap">
            <span class="ef-icon">📍</span>
            <input id="location-input" class="ef-input" name="location"
              [(ngModel)]="location" [placeholder]="'LOCATION_PLACEHOLDER'|translate" />
          </div>
        </div>

        <!-- Submit -->
        <div class="ef-col-full">
          <button class="ef-submit" type="submit">{{'SAVE'|translate}} {{'EXPENSE'|translate}} →</button>
        </div>

      </form>
    </div>
  </div>

</div>
