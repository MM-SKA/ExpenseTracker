<div class="page-card">
  <div class="page-header">
    <div>
      <p class="eyebrow">New expense</p>
      <h1 class="section-title">Add a purchase</h1>
      <p class="subtitle-text">Capture expenses with category, amount, and date for better reporting.</p>
    </div>
  </div>

  <div class="panel-card">
    <form (ngSubmit)="save()">
      <div class="form-field">
        <label for="category-list">Category</label>
        <select id="category-list" name="category" [(ngModel)]="categoryId"
          [disabled]="isLoadingCategories || categories.length === 0">
          @if (isLoadingCategories) {
          <option value="" disabled selected>Loading categories...</option>
          }
          @if (!isLoadingCategories && categories.length === 0) {
          <option value="" disabled>No categories available</option>
          }
          @for (c of categories; track c.id) {
          <option [value]="c.id">{{ c.name }}</option>
          }
        </select>
      </div>

      <div class="form-field">
        <label for="description-input">Description</label>
        <input id="description-input" name="description" [(ngModel)]="description"
          placeholder="Coffee, groceries, subscription" />
      </div>

      <div class="form-field">
        <label for="amount-input">Amount</label>
        <input id="amount-input" name="amount" type="number" step="0.01" [(ngModel)]="amount" placeholder="0.00" />
      </div>

      <div class="form-field">
        <label for="date-input">Date</label>
        <input id="date-input" name="date" type="date" [(ngModel)]="date" />
      </div>

      <button class="button-primary" type="submit">Save expense</button>
    </form>
  </div>
</div>
