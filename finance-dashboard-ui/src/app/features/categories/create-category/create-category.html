<div class="cf-page">

  <p class="cf-eyebrow">New Category</p>
  <h1 class="cf-title">Create a category</h1>
  <p class="cf-subtitle">Organize your expenses by creating custom categories for better tracking and analytics.</p>

  <div class="cf-card">
    <div class="cf-card-body">

      <div class="cf-icon-block">
        <div class="cf-icon">🏷</div>
        <span class="cf-icon-label">Category</span>
      </div>

      <div class="cf-field">
        <label for="category-input" class="cf-label">Category Name</label>
        <input
          id="category-input"
          class="cf-input"
          name="category-name"
          type="text"
          [(ngModel)]="name"
          placeholder="e.g. Subscription, Groceries…" />
      </div>

      <button class="cf-submit" (click)="createCategory()">Save category →</button>

    </div>
  </div>

</div>
