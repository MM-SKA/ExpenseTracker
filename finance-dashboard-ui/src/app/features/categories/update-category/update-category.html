<div class="container mt-4">

    <div class="card">

        <div class="card-header">

            <h4>Edit Category</h4>

        </div>

        <div class="card-body">

            <div class="mb-3">

                <label>
                    Category Name
                </label>

                <input 
                    class="form-control"
                    [(ngModel)]="name">

            </div>

            <button
                class="btn btn-warning"
                (click)="updateCategory()">

                Update

            </button>

        </div>

    </div>

</div>
