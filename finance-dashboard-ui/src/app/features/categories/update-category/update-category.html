<div class="cf-page">

  <p class="cf-eyebrow">Edit Category</p>
  <h1 class="cf-title">{{'UPDATE_CATEGORY'|translate}}</h1>
  <p class="cf-subtitle">Rename this category — all linked expenses will reflect the change.</p>

  <div class="cf-card">
    <div class="cf-card-body">

      <div class="cf-icon-block">
        <div class="cf-icon">🏷</div>
        <span class="cf-icon-label">{{'EDITING_CATEGORY'|translate}}</span>
      </div>

      <div class="cf-field">
        <label class="cf-label" for="category-input">{{'CATEGORY_NAME'|translate}}</label>
        <input id="category-input"
          class="cf-input"
          [(ngModel)]="name"
          [placeholder]="'CATEGORY_NAME_PLACEHOLDER'|translate" />
      </div>

      <button class="cf-submit" (click)="updateCategory()">{{'UPDATE_CATEGORY'|translate}} →</button>

    </div>
  </div>

</div>
