<div class="cf-page">

  <p class="cf-eyebrow">Edit Category</p>
  <h1 class="cf-title">Update category</h1>
  <p class="cf-subtitle">Rename this category — all linked expenses will reflect the change.</p>

  <div class="cf-card">
    <div class="cf-card-body">

      <div class="cf-icon-block">
        <div class="cf-icon">🏷</div>
        <span class="cf-icon-label">Editing category</span>
      </div>

      <div class="cf-field">
        <label class="cf-label" for="category-input">Category Name</label>
        <input id="category-input"
          class="cf-input"
          [(ngModel)]="name"
          placeholder="Category name…" />
      </div>

      <button class="cf-submit" (click)="updateCategory()">Update category →</button>

    </div>
  </div>

</div>
